<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300" role="img" aria-labelledby="title desc">
  <title id="title">Meet Vora Software Engineer</title>
  <desc id="desc">A dark blue banner introducing Meet Vora and his focus on .NET, data systems, React, and AI. Connected geometric nodes decorate the right side.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1325"/>
      <stop offset="1" stop-color="#152b43"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#456078" opacity="0.34"/>
    </pattern>
  </defs>
  <rect width="1080" height="300" rx="20" fill="url(#background)"/>
