  <rect x="45" y="43" width="7" height="24" rx="3" fill="#5eead4"/>
  <text x="65" y="61" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" letter-spacing="2.8" fill="#b6c6d8">SOFTWARE ENGINEER</text>
  <text x="45" y="143" font-family="Arial, Helvetica, sans-serif" font-size="57" font-weight="700" letter-spacing="-1.8" fill="#f4f8fc">Hi, I'm Meet Vora.</text>
  <text x="48" y="191" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c6d4e4">.NET · Data systems · React · AI</text>
  <text x="48" y="249" font-family="Courier New, monospace" font-size="17" fill="#5eead4">vmeet24</text>
  <text x="138" y="249" font-family="Courier New, monospace" font-size="17" fill="#8ca5be">// Boston, MA</text>
